name: Native contest checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - run: node --check src/logic/export.js && node --check src/contest/event.js && git diff --check
